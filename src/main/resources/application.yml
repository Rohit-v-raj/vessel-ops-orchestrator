server:
  # 8080 is the berth planner, 8000 the ETA model, 5173 the console.
  port: 8081

spring:
  application:
    name: vessel-ops-orchestrator
  temporal:
    namespace: default
    connection:
      target: 127.0.0.1:7233
    # The starter scans these packages for @WorkflowImpl and @ActivityImpl
    # classes and creates one worker per task queue they name.
    workers-auto-discovery:
      packages:
        - com.port.ops

# Override any of these on the command line, for example
#   gradlew.bat bootRun --args="--ops.sim.breakdown-rate=0.3"
ops:
  # 1 real second = 360 terminal seconds (6 minutes), so a 12-hour visit takes 2 minutes.
  time-scale: 360
  # Planning figures the workflow uses. The simulated cranes are a little faster or slower.
  moves-per-hour: 30
  moves-per-crane: 400
  max-cranes: 3
  # Terminal time. The move list is due within 24 hours of the berth being confirmed (4 real minutes).
  move-list-deadline: 24h
  # Warn the berth planner when completion is expected this much later than planned.
  overrun-threshold: 60m
  # Lashing, paperwork and the pilot between the last move and the departure.
  departure-after-completion: 1h
  sim:
    # Chance that a call to a crane's control system fails and is retried.
    failure-rate: 0.1
    # Chance that a crane breaks down while working a bay. Off by default.
    breakdown-rate: 0.0
    # How long the crane system takes to answer a reservation.
    latency: 300ms
